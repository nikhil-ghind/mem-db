syntax = "proto3";

package memdb;

option go_package = "github.com/nikhilghind/mem-db/proto";

service MemDB {
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc RangeScan(RangeScanRequest) returns (stream KeyValue);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Execute(QueryRequest) returns (QueryResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
}

message InsertRequest {
  string table = 1;
  string key = 2;
  bytes value = 3;
}

message InsertResponse {
  bool success = 1;
  string message = 2;
}

message GetRequest {
  string table = 1;
  string key = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message DeleteRequest {
  string table = 1;
  string key = 2;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message RangeScanRequest {
  string table = 1;
  string start_key = 2;
  string end_key = 3;
}

message KeyValue {
  string key = 1;
  bytes value = 2;
}

message QueryRequest {
  string query = 1;
}

message QueryResponse {
  bool success = 1;
  string message = 2;
  bytes value = 3;
  repeated KeyValue rows = 4;
  int64 duration_ns = 5;
}

message StatsRequest {}

message StatsResponse {
  int32 table_count = 1;
  int32 total_keys = 2;
  map<string, TableStats> tables = 3;
}

message TableStats {
  int32 size = 1;
  int32 height = 2;
  int32 order = 3;
}
